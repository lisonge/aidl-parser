name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: "2026.10.24"
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: node scripts/check-release-version.ts

      - name: Download pinned upstream sources
        run: pnpm upstream:sync

      - name: Build package
        run: pnpm build:parser

      - name: Verify package
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:package

      - name: Publish to npm
        run: pnpm --filter aidl-parser publish --no-git-checks

      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file aidl-parser/CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
