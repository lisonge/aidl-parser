name: Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "aidl-cpp/**"
      - "aidl-parser/**"
      - "aidl-website/**"
      - "scripts/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          version: "2026.10.24"
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download pinned upstream sources
        run: pnpm upstream:sync

      - name: Build website
        run: pnpm build

      - name: Deploy website
        run: >-
          pnpm dlx
          --allow-build=sharp
          --allow-build=workerd
          wrangler@4.118.0 pages deploy aidl-website/dist
          --project-name=aidl-parser
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
